name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # xcodebuild passes TEST_RUNNER_* variables to the tests without the prefix (timing budgets read CI).
      TEST_RUNNER_CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # xcodebuild compiles the String Catalogs (some SwiftPM versions only copy them); tests expect English.
      - name: Package tests (FolioCore)
        working-directory: Packages/FolioCore
        run: |
          xcodebuild test -scheme FolioCore-Package -destination 'platform=macOS' \
            -derivedDataPath ../../build/PackageDerivedData -testLanguage en -testRegion US

      - name: Generate project
        run: xcodegen generate

      - name: App unit tests
        run: |
          xcodebuild -project Folio.xcodeproj -scheme Folio -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -testLanguage en -testRegion US test -only-testing:FolioTests

      # The test step already built Folio.app. Attach it so the run can be downloaded and tried.
      - name: Zip Folio.app
        run: |
          APP="build/DerivedData/Build/Products/Debug/Folio.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Folio-debug.zip

      - name: Upload Folio.app
        uses: actions/upload-artifact@v4
        with:
          name: Folio-debug
          path: Folio-debug.zip
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
