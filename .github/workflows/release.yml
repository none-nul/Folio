name: Release

# Push a tag such as v1.2.0 (matching a "## [1.2.0]" section in CHANGELOG.md) to publish a release.
# The appcast.xml attached to the newest release is the feed every installed copy of Folio checks.
# When the Sparkle key is missing, the disk image is still published and appcast.xml is left off.
on:
  push:
    tags: ['v*']
  # A trial run from the Actions tab: builds and packages, uploads the result, publishes nothing.
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (needs a section in CHANGELOG.md)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build, package and sign the update
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::Secret SPARKLE_ED_PRIVATE_KEY is unset. The disk image will be published without an in-app update feed."
          fi
          VERSION="${{ inputs.version }}"
          script/release.sh "${VERSION:-${GITHUB_REF_NAME#v}}"

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: build/ReleaseDerivedData.log

      - name: Package browser extensions
        run: script/package-extensions.sh

      - name: Upload the trial build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: folio-trial-build
          path: dist/

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: Folio-dmg
          path: dist/Folio-*.dmg
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS=()
          [[ "$VERSION" == *-* ]] && FLAGS+=(--prerelease)
          shopt -s nullglob
          ASSETS=(dist/Folio-*.dmg dist/Folio-*.zip dist/folio-chromium-*.zip dist/folio-firefox-*.xpi)
          [[ -f dist/appcast.xml ]] && ASSETS+=(dist/appcast.xml)
          shopt -u nullglob
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "::error::no release assets in dist/"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "Folio $VERSION" --notes-file dist/release-notes.md "${FLAGS[@]}" "${ASSETS[@]}"
